# Modifier server_name, certificats et chemins suivant ton installation.
# Ce fichier est un EXEMPLE de bloc serveur, pas une config complète de Nginx.
server {
    listen 443 ssl http2;
    server_name auth.nicolabz.dev;

    ssl_certificate     /etc/letsencrypt/live/auth.nicolabz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.nicolabz.dev/privkey.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
    }
}

server {
    listen 80;
    server_name auth.nicolabz.dev;
    return 301 https://$host$request_uri;
}
